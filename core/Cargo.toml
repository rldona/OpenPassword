[package]
name = "op-core"
description = "OpenPassword cryptographic core: key derivation, vault and .opvault backup format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Allows creating vaults with KDF parameters below the security minimum.
# Only for tests: never enable it in a shipped build.
insecure-test-params = []

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
# KeePass (KDBX) import. Same RustCrypto generation as chacha20poly1305 0.10 (cipher 0.4).
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20 = "0.9"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.42"
salsa20 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
getrandom = "0.4"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
# 1Password .1pux exports. Pinned: newer 9.1.x releases are under two weeks old.
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
op-core = { path = ".", features = ["insecure-test-params"] }

[lints]
workspace = true
