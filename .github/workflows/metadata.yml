name: Regenerate dependency metadata

# Temporal: regenera gradle/verification-metadata.xml en Linux, que resuelve artefactos
# que macOS no pide. Se borra en cuanto el fichero esté actualizado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install NDK and platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "platforms;android-37.0"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Regenerate
        working-directory: android
        run: |
          ./gradlew --write-verification-metadata sha256 \
            :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
