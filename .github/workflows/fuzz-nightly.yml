name: Fuzz nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: the corpus cache is keyed per run and restored from the latest.
concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target:
          - import
          - kdbx_xml
          - kdbx_container
          - key_file
          - backup_header
          - totp
          - vault_json
          - item_open
          - item_plaintext
          - backup_body
          - ffi_records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      # The corpus grows from one night to the next. Every run saves a new entry and the next
      # one restores the most recent, so it is never lost and never overwritten.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed the corpus
        working-directory: fuzz
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cp -n seeds/${{ matrix.target }}/* "corpus/${{ matrix.target }}/"
      - name: Fuzz for 10 min
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to that target.
        run: cargo +nightly fuzz run -O -a --target x86_64-unknown-linux-gnu "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- -max_total_time=600 -max_len=65536 -rss_limit_mb=2048 -timeout=10
      # Once a week (Sunday's run) keep only the entries that add coverage.
      - name: Minimize the corpus
        if: success()
        working-directory: fuzz
        run: |
          if [ "$(date -u +%u)" = 7 ]; then
            cargo +nightly fuzz cmin -O -a --target x86_64-unknown-linux-gnu "${{ matrix.target }}" "corpus/${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
