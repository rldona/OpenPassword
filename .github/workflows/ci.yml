name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The shipped library must build without the test-only feature.
      - run: cargo build -p op-core -p opvault-cli --release --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any vulnerability. Ignored advisories, with their reason, are in .cargo/audit.toml.
      - run: cargo audit --deny warnings

  # Short smoke run of every parser fuzzer; longer runs are local (fuzz/README.md).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 60 s
        working-directory: fuzz
        run: |
          for t in import kdbx_xml key_file backup_header totp; do
            mkdir -p "corpus/$t" && cp seeds/$t/* "corpus/$t/"
            cargo +nightly fuzz run -O "$t" "corpus/$t" -- -max_total_time=60 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The runner image already ships the Android SDK; only add what this project pins.
      - name: Install NDK and platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "platforms;android-37.0"
      - run: cargo install cargo-ndk --locked
      # Also runs verifyDebugManifest / verifyReleaseManifest (no network permission, no backup).
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain
        working-directory: android
      # Reproducible builds: compare with a local build of the same commit (docs/fdroid/README.md).
      - name: SHA-256 of the unsigned release APK
        run: sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
