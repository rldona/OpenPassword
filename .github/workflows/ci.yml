name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The shipped library must build without the test-only feature.
      - run: cargo build -p op-core -p opvault-cli --release --locked
      # cfg(fuzzing) hooks must not reach the shipped library. Checked on the cdylib (a name search
      # in an .rlib finds nothing: LTO bitcode), with a control that builds WITH the hooks and
      # must find them. See scripts/check-no-fuzzing-hooks.sh.
      - run: cargo build -p op-ffi --release --locked
      - run: scripts/check-no-fuzzing-hooks.sh target/release/libop_ffi.so
      - run: scripts/check-no-fuzzing-hooks.sh --self-test

  # Advisories, licenses, bans and sources in one run (deny.toml). Replaces cargo-audit: deny.toml
  # reads the same RustSec database, so keeping both would only duplicate the advisory check.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      # fuzz/ is its own workspace (fuzz/Cargo.lock): the run above does not see it.
      - name: cargo deny on the fuzz workspace
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked --config fuzz/deny.toml check

  # Short smoke run of every parser fuzzer; longer runs are local (fuzz/README.md).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz each target for 30 s
        working-directory: fuzz
        run: |
          for t in import kdbx_xml kdbx_container key_file backup_header totp vault_json item_open item_plaintext backup_body ffi_records; do
            mkdir -p "corpus/$t" && cp seeds/$t/* "corpus/$t/"
            # The prebuilt cargo-fuzz is a musl binary and would default to that target.
            cargo +nightly fuzz run -O -a --target x86_64-unknown-linux-gnu "$t" "corpus/$t" -- -max_total_time=30 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode = commits de la historia; con el clon superficial siempre sería 1.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The runner image already ships the Android SDK; only add what this project pins.
      - name: Install NDK and platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "platforms;android-37.0"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # La clave de firma vive en ~/.openpassword; en la CI llega por secretos. Las PR no la
      # reciben: así una rama no puede exfiltrarla, y su APK queda sin firmar.
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos RELEASE_* para firmar el APK."
            exit 1
          fi
          mkdir -p "$HOME/.openpassword"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.openpassword/openpassword-release.p12"
          chmod 600 "$HOME/.openpassword/openpassword-release.p12"
          {
            printf 'storeFile=%s\n' "$HOME/.openpassword/openpassword-release.p12"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$HOME/.openpassword/release-signing.properties"
          chmod 600 "$HOME/.openpassword/release-signing.properties"
      # lintDebug catches calls above minSdk (NewApi). Also runs verifyDebugManifest / verifyReleaseManifest (no network permission, no backup).
      - name: Build, test and lint
        working-directory: android
        run: |
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}" \
            --console=plain
      # The libraries that go into the APK must not contain the cfg(fuzzing) hooks.
      - name: No fuzzing hooks in the APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          unzip -q "$APK" 'lib/*' -d "$RUNNER_TEMP/apk"
          scripts/check-no-fuzzing-hooks.sh "$RUNNER_TEMP"/apk/lib/*/libop_ffi.so
      - name: Verify the APK signature
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Collect the APK
        run: |
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/OpenPassword.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/OpenPassword-unsigned.apk
          fi
          (cd dist && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openpassword-apk
          path: dist/
          retention-days: 14

  # Publica el APK firmado. En main actualiza una prerelease rodante (etiqueta `latest`); en una
  # etiqueta v* crea esa release. Se descarga sin cuenta desde la página de releases.
  publish:
    if: github.event_name == 'push'
    needs: [core, audit, fuzz, android]
    runs-on: ubuntu-24.04
    # Scoped to this job; the workflow default stays contents: read.
    permissions:
      contents: write
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openpassword-apk
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$REF_NAME" dist/OpenPassword.apk dist/SHA256SUMS \
                --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$REF_NAME" dist/OpenPassword.apk dist/SHA256SUMS \
                --repo "$GITHUB_REPOSITORY" \
                --title "OpenPassword ${REF_NAME#v}" \
                --notes "APK firmado de la etiqueta ${REF_NAME} (commit ${COMMIT:0:7})."
            fi
          else
            NOTES="Build automática de \`main\` en \`${COMMIT:0:7}\`. Se instala encima de la anterior."
            if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload latest dist/OpenPassword.apk dist/SHA256SUMS \
                --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
            else
              gh release create latest dist/OpenPassword.apk dist/SHA256SUMS \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease \
                --title "Última build de main" \
                --notes "$NOTES"
            fi
          fi
