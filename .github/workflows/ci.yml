name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The shipped library must build without the test-only feature.
      - run: cargo build -p op-core -p opvault-cli --release --locked
      # cfg(fuzzing) hooks must not reach the shipped library. Checked on the cdylib (a name search
      # in an .rlib finds nothing: LTO bitcode), with a control that builds WITH the hooks and
      # must find them. See scripts/check-no-fuzzing-hooks.sh.
      - run: cargo build -p op-ffi --release --locked
      - run: scripts/check-no-fuzzing-hooks.sh target/release/libop_ffi.so
      - run: scripts/check-no-fuzzing-hooks.sh --self-test

  # Advisories, licenses, bans and sources in one run (deny.toml). Replaces cargo-audit: deny.toml
  # reads the same RustSec database, so keeping both would only duplicate the advisory check.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      # fuzz/ is its own workspace (fuzz/Cargo.lock): the run above does not see it.
      - name: cargo deny on the fuzz workspace
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked --config fuzz/deny.toml check

  # Short smoke run of every parser fuzzer; longer runs are local (fuzz/README.md).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz each target for 30 s
        working-directory: fuzz
        run: |
          for t in import kdbx_xml kdbx_container key_file backup_header totp vault_json item_open item_plaintext backup_body ffi_records; do
            mkdir -p "corpus/$t" && cp seeds/$t/* "corpus/$t/"
            # The prebuilt cargo-fuzz is a musl binary and would default to that target.
            cargo +nightly fuzz run -O -a --target x86_64-unknown-linux-gnu "$t" "corpus/$t" -- -max_total_time=30 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The runner image already ships the Android SDK; only add what this project pins.
      - name: Install NDK and platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "platforms;android-37.0"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      # lintDebug catches calls above minSdk (NewApi). Also runs verifyDebugManifest / verifyReleaseManifest (no network permission, no backup).
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain
        working-directory: android
      # The libraries that go into the APK must not contain the cfg(fuzzing) hooks.
      - name: No fuzzing hooks in the APK
        run: |
          unzip -q android/app/build/outputs/apk/release/app-release-unsigned.apk 'lib/*' -d "$RUNNER_TEMP/apk"
          scripts/check-no-fuzzing-hooks.sh "$RUNNER_TEMP"/apk/lib/*/libop_ffi.so
      # Reproducible builds: compare with a local build of the same commit (docs/archive/fdroid/README.md).
      - name: SHA-256 of the unsigned release APK
        run: sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

  # Only for version tags. Rebuilds the unsigned APK, generates the SBOMs and attests all of them
  # (Sigstore, SLSA provenance). It does not create a GitHub release: attach the artifacts by hand.
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [core, audit, android]
    runs-on: ubuntu-24.04
    # Scoped to this job; the workflow default stays contents: read.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install NDK and platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "platforms;android-37.0"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: ./gradlew :app:assembleRelease :app:cyclonedxDirectBom --console=plain
        working-directory: android
      - name: Collect the release files
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/
          # cargo-cyclonedx writes ffi/op-ffi.cdx.json next to the crate manifest.
          cargo cyclonedx --manifest-path ffi/Cargo.toml --format json --spec-version 1.5
          cp ffi/op-ffi.cdx.json release/op-ffi.cdx.json
          cp android/app/build/reports/cyclonedx-direct/bom.json release/openpassword-android.cdx.json
          (cd release && sha256sum * | tee SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/app-release-unsigned.apk
            release/op-ffi.cdx.json
            release/openpassword-android.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: release/
          retention-days: 90
