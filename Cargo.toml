[workspace]
resolver = "3"
members = ["core", "cli", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/rldona/OpenPassword"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` builds with --cfg fuzzing (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
# panic = "unwind": see docs/audit/decisions.md ADR-AUD-03. A hostile .opvault must not
# kill the app; UniFFI turns a panic into InternalException, which Kotlin catches.
panic = "unwind"

# Argon2 is unusably slow unoptimized; keep tests and debug builds fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# KeePass AES-KDF runs millions of AES rounds: unusable unoptimized.
[profile.dev.package.aes]
opt-level = 3
