[package]
name = "op-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
op-core = { path = "../core" }
op-ffi = { path = "../ffi" }
serde_json = "1"

# Not part of the main workspace: it needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "import"
path = "fuzz_targets/import.rs"
test = false
doc = false
bench = false

