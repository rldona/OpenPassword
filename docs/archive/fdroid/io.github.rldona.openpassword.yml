# BORRADOR de la receta para fdroiddata (metadata/io.github.rldona.openpassword.yml).
# Revisar antes de enviarla: ver docs/fdroid/README.md, apartado "Por confirmar".
Categories:
  - Password & 2FA
  - Security
License: GPL-3.0-or-later
AuthorName: rldona
SourceCode: https://github.com/rldona/OpenPassword
IssueTracker: https://github.com/rldona/OpenPassword/issues
Changelog: https://github.com/rldona/OpenPassword/releases

AutoName: OpenPassword

RepoType: git
Repo: https://github.com/rldona/OpenPassword.git
# Reproducible build: F-Droid builds the APK and publishes ours only if it is identical
# (apart from the signature) to this one.
Binaries: https://github.com/rldona/OpenPassword/releases/download/v%v/openpassword-%v.apk

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential
    output: build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      # Installs the exact toolchain pinned in rust-toolchain.toml (1.99.1 and its targets).
      - $$rustup$$/rustup-init.sh -y --default-toolchain none --profile minimal
      - source $HOME/.cargo/env
      - cd ../.. && rustup show
      - cargo install cargo-ndk --locked --version 4.1.2
    ndk: 30.0.16248370
    gradle:
      - yes

AllowedAPKSigningKeys: c87c49b9b257111ae94907a8e143802a1c22832681e71c96f39cae50ef7d7b57

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
