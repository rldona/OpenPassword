[package]
name = "opvault-cli"
description = "Inspect and decrypt OpenPassword .opvault backups without the app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "opvault"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
op-core = { path = "../core" }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[lints]
workspace = true
